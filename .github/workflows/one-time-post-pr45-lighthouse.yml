name: One-time production Lighthouse after PR45

on:
  push:
    branches: [audit/post-pr45-lighthouse-20261114]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Install Lighthouse
        shell: bash
        run: |
          node --version
          google-chrome --version
          npm install -g lighthouse@12
          lighthouse --version
      - name: Measure the public production website
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/lighthouse
          run() {
            label="$1"
            url="$2"
            mode="$3"
            flags=""
            if [ "$mode" = desktop ]; then flags="--preset=desktop"; fi
            echo "AUDIT_START $label $url $mode"
            timeout 155s lighthouse "$url" --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --throttling-method=simulate --output=json --output-path="/tmp/lighthouse/$label.json" --quiet $flags || echo "AUDIT_FAILED $label"
            echo "AUDIT_END $label"
          }
          run home-mobile-a "https://dietzbookkeeping.com/" mobile
          run home-mobile-b "https://dietzbookkeeping.com/" mobile
          run estimate-mobile "https://dietzbookkeeping.com/estimate/" mobile
          run schedule-mobile "https://dietzbookkeeping.com/schedule/" mobile
          run home-desktop "https://dietzbookkeeping.com/" desktop
      - name: Summarize Lighthouse and Jotform requests
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob, os, statistics
          files=sorted(glob.glob('/tmp/lighthouse/*.json'))
          if len(files)!=5:
              raise SystemExit(f'Expected 5 reports, got {len(files)}: {files}')
          homepage=[]
          for path in files:
              d=json.load(open(path))
              aud=d['audits']; cats=d['categories']
              metric=lambda key: aud.get(key,{}).get('numericValue')
              r={
                'name':os.path.basename(path),
                'url':d.get('finalDisplayedUrl'),
                'score':{k:round(v['score']*100) if v.get('score') is not None else None for k,v in cats.items()},
                'FCP_ms':metric('first-contentful-paint'),
                'LCP_ms':metric('largest-contentful-paint'),
                'TBT_ms':metric('total-blocking-time'),
                'CLS':metric('cumulative-layout-shift'),
                'speed_index_ms':metric('speed-index'),
                'TTI_ms':metric('interactive')
              }
              items=aud.get('network-requests',{}).get('details',{}).get('items',[])
              r['requests']=len(items)
              r['total_kib']=round(sum(x.get('transferSize',0) for x in items)/1024)
              r['jotform_requests']=sum(1 for x in items if ('jotform.com' in x.get('url','') or 'jotfor.ms' in x.get('url','')))
              r['jotform_kib']=round(sum(x.get('transferSize',0) for x in items if ('jotform.com' in x.get('url','') or 'jotfor.ms' in x.get('url','')))/1024)
              r['heavy_requests']=[{'KiB':round(x.get('transferSize',0)/1024),'url':x.get('url','')[:130]} for x in sorted(items,key=lambda x:x.get('transferSize',0),reverse=True)[:6]]
              print('MEASUREMENT '+json.dumps(r,ensure_ascii=False))
              for cat in ('accessibility','seo'):
                  for ref in cats[cat]['auditRefs']:
                      a=aud.get(ref['id'],{})
                      if a.get('score') is not None and a['score']<1:
                          print('ISSUE '+json.dumps({'name':r['name'],'category':cat,'audit':ref['id'],'score':a['score'],'title':a.get('title')},ensure_ascii=False))
              if r['name'].startswith('home-mobile'):homepage.append(r)
          print('MOBILE_HOME_SUMMARY '+json.dumps({
            'scores':[x['score']['performance'] for x in homepage],
            'median_performance':statistics.median(x['score']['performance'] for x in homepage),
            'LCP_ms':[x['LCP_ms'] for x in homepage],
            'TBT_ms':[x['TBT_ms'] for x in homepage],
            'CLS':[x['CLS'] for x in homepage],
            'jotform_kib':[x['jotform_kib'] for x in homepage]
          }))
          print('PR45_PRODUCTION_LIGHTHOUSE_COMPLETE')
          PY
