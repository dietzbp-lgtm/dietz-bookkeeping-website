name: Build social sharing image (preview only)

# Temporary, branch-scoped job: create an exact composite of the existing local
# founder portrait and logo. Never push a generated binary to production.
on:
  push:
    branches:
      - preview/social-sharing-card-20261112
    paths:
      - scripts/generate_social_image.py
      - .github/workflows/social-image-preview.yml

permissions:
  contents: write

jobs:
  generate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image composition dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate 1200x630 JPEG using existing local assets
        run: python scripts/generate_social_image.py
      - name: Verify generated image
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('public/images/dietzbookkeeping-social-1200x630.jpg')
          assert p.is_file(), 'Missing generated social image'
          with Image.open(p) as im:
              assert im.size == (1200, 630), im.size
          assert p.stat().st_size < 500000, 'Image unexpectedly large'
          print(f'Verified: {p.stat().st_size} bytes')
          PY
      - name: Commit social image to preview branch only
        run: |
          git add public/images/dietzbookkeeping-social-1200x630.jpg
          if git diff --cached --quiet; then
            echo 'Social image unchanged'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate Dietz social sharing image from original brand assets'
            git push origin HEAD:preview/social-sharing-card-20261112
          fi
