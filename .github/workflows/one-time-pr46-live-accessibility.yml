name: One-time PR46 live accessibility verification

on:
  push:
    branches: [verify/pr46-live-accessibility-20261115]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Lighthouse 13 and browser test support
        run: npm install -g lighthouse@13 puppeteer-core@24
      - name: Verify live homepage and consultation accessibility
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 20 https://dietzbookkeeping.com/ | grep -q 'role="img"'; then echo 'PRODUCTION_UPDATED'; break; fi
            echo "PR46 not visible yet: attempt $i"
            sleep 8
          done
          curl -fsSL --max-time 25 https://dietzbookkeeping.com/ > /tmp/production-home.html
          curl -fsSL --max-time 25 https://dietzbookkeeping.com/schedule/ > /tmp/production-schedule.html
          grep -q 'role="img"' /tmp/production-home.html
          grep -q 'bg-blue-700' /tmp/production-home.html
          grep -q '<h2 class="font-semibold text-slate-900 mb-4">Services</h2>' /tmp/production-schedule.html
          echo 'LIVE STATIC PAGE SEMANTICS PASS'
          lighthouse https://dietzbookkeeping.com/ --preset=desktop --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=accessibility --throttling-method=simulate --output=json --output-path=/tmp/home-a11y.json --quiet
          lighthouse https://dietzbookkeeping.com/schedule/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=accessibility --throttling-method=simulate --output=json --output-path=/tmp/schedule-a11y.json --quiet
          python3 - <<'PY'
          import json
          for n,path in (('desktop-home','/tmp/home-a11y.json'),('mobile-schedule','/tmp/schedule-a11y.json')):
            data=json.load(open(path))
            a=data['audits']
            score=data['categories']['accessibility']['score']
            failed=[ref['id'] for ref in data['categories']['accessibility']['auditRefs'] if a[ref['id']].get('score') is not None and a[ref['id']]['score']<1]
            print('LIVE_A11Y',n,'version',data['lighthouseVersion'],'score',round(100*score),'failed',failed)
            assert score==1 and not failed
          print('PR46 PRODUCTION ACCESSIBILITY PASS')
          PY
      - name: Verify Keily remains unloaded until click and Calendly iframe appears
        shell: bash
        run: |
          NODE_PATH="$(npm root -g)" node <<'JS'
          const p=require('puppeteer-core');
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await p.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:1});
            let jotformRequests=0;
            page.on('request',req=>{if(/jotform.com|jotfor.ms/i.test(req.url()))jotformRequests++});
            const response=await page.goto('https://dietzbookkeeping.com/',{waitUntil:'load',timeout:30000});
            await pause(800);
            const home=await page.evaluate(()=>({
              reviewRatings:document.querySelectorAll('div[role="img"][aria-label="Rated 5 out of 5 stars on Google"]').length,
              chatButton:!!document.querySelector('button[aria-label="Chat with Keily"]'),
            }));
            console.log('LIVE_HOME',JSON.stringify(home),'status',response.status(),'jotformBeforeTap',jotformRequests);
            if(response.status()!==200||home.reviewRatings!==3||!home.chatButton||jotformRequests!==0)throw Error('Home regression');
            const schedule=await browser.newPage();
            await schedule.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:1});
            await schedule.goto('https://dietzbookkeeping.com/schedule/',{waitUntil:'load',timeout:30000});
            await pause(9500);
            const s=await schedule.evaluate(()=>({
              calendly:!!document.querySelector('iframe[src*="calendly.com"]'),
              headings:[...document.querySelectorAll('footer h2')].map(x=>x.textContent),
              fallback:document.body.innerText.includes('Open Calendly in a new tab')
            }));
            console.log('LIVE_SCHEDULE',JSON.stringify(s));
            if(!s.calendly||s.headings.length<3||!s.fallback)throw Error('Calendly/fallback regression');
            await browser.close();
            console.log('PR46 LIVE BROWSER SMOKE PASS');
          })().catch(error=>{console.error('SMOKE_ERROR',error.stack||String(error));process.exitCode=1});
          JS
