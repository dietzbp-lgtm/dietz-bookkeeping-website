name: One-time old Search Console redirect errors check
on:
  push:
    branches: [audit/two-old-redirect-errors-20261115]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check exact URL redirect chains and final canonical
        shell: bash
        run: |
          set -u
          for path in /monthly-bookkeeping /tampa-cleanup-bookkeeping /monthly-bookkeeping/ /tampa-cleanup-bookkeeping/; do
            url="https://dietzbookkeeping.com$path"
            echo "=== CHECK $url ==="
            curl --max-time 20 -sS -D /tmp/firstheaders -o /dev/null -w "INITIAL_CODE=%{http_code} FIRST_LOCATION=%{redirect_url}\n" "$url"
            grep -iE '^(HTTP/|location:|content-type:)' /tmp/firstheaders | head -8 || true
            curl --max-time 25 -sSL -D /tmp/finalheaders -o /tmp/finalhtml -w "FINAL_CODE=%{http_code} FINAL_URL=%{url_effective} REDIRECT_COUNT=%{num_redirects}\n" "$url"
            grep -ioE '<link rel="canonical"[^>]+>' /tmp/finalhtml | head -2 || true
          done
          echo 'REDIRECT_CHECK_FINISHED'
