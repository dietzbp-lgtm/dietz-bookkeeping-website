name: Read-only live SEO HTTP header audit
on:
  push:
    branches: [audit/ai-crawler-headers-20261119]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review public live headers robots and pre-rendered HTML
        shell: bash
        run: |
          set -euo pipefail
          for path in /robots.txt / /monthly-bookkeeping/ /quickbooks-online-bookkeeping/ /sitemap.xml; do
            echo "=== URL https://dietzbookkeeping.com$path ==="
            curl --max-time 20 -sSL -D /tmp/dietz-headers.txt -o /tmp/dietz-body.txt -w 'HTTP_CODE=%{http_code} REDIRECTS=%{num_redirects} FINAL=%{url_effective}\n' "https://dietzbookkeeping.com$path"
            cat /tmp/dietz-headers.txt
            if [ "$path" = /robots.txt ]; then
              echo ROBOTS_TEXT_BEGIN
              head -150 /tmp/dietz-body.txt
              echo ROBOTS_TEXT_END
            elif [ "$path" = /sitemap.xml ]; then
              grep -o '<loc>' /tmp/dietz-body.txt | wc -l
            else
              grep -oiE '<(title|meta name="robots"|link rel="canonical")[^>]*>' /tmp/dietz-body.txt | head -12 || true
              grep -io 'From daily transactions to clearer decisions' /tmp/dietz-body.txt | head -1 || true
            fi
          done
          echo LIVE_HEADER_AUDIT_COMPLETE
