name: Read-only public cache header audit (isolated branch)

on:
  push:
    branches:
      - audit/live-cache-headers-20261113
    paths:
      - .github/workflows/live-cache-audit.yml

permissions:
  contents: write

jobs:
  capture-cache-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public response headers for homepage and assets
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path

          root = 'https://dietzbookkeeping.com'
          samples = [
              ('home', root + '/'),
              ('portrait', root + '/images/dietzbookeepingabout.webp'),
              ('social-image', root + '/images/dietzbookkeeping-social-1200x630.jpg'),
              ('sitemap', root + '/sitemap.xml')
          ]
          try:
              req = urllib.request.Request(root + '/?cache_audit=20261113', headers={'User-Agent': 'Mozilla/5.0 (compatible; SEOQualityAudit/1.0)'})
              with urllib.request.urlopen(req, timeout=20) as res:
                  markup = res.read().decode('utf-8', 'replace')
              js = re.search(r'(?:src|href)="(/assets/[^"]+\.js)"', markup)
              css = re.search(r'(?:href|src)="(/assets/[^"]+\.css)"', markup)
              if js: samples.append(('fingerprinted-js',root + js.group(1)))
              if css: samples.append(('fingerprinted-css',root + css.group(1)))
          except Exception as ex:
              print('Unable to discover hashed JS/CSS:', type(ex).__name__, str(ex)[:200])
          def probe(label,url):
              request = urllib.request.Request(url, method='HEAD', headers={'User-Agent':'Mozilla/5.0 (compatible; SEOQualityAudit/1.0)'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      h = response.headers
                      return {'name':label,'url':url,'status':response.status,
                              'headers':{key: h.get(key) for key in ['cache-control','age','cf-cache-status','etag','last-modified','expires','content-type','strict-transport-security','x-content-type-options','referrer-policy','content-security-policy']}}
              except urllib.error.HTTPError as ex:
                  return {'name':label,'url':url,'status':ex.code,'error':str(ex)}
              except Exception as ex:
                  return {'name':label,'url':url,'error':type(ex).__name__+': '+str(ex)}
          result = {'context':'Public response headers (read-only), not Cloudflare dashboard settings',
                    'tests': [probe(label,url) for label,url in samples]}
          Path('live-cache-audit-20261113.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Retain public HTTP audit results on isolated branch only
        shell: bash
        run: |
          git add live-cache-audit-20261113.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record public cache headers for read-only audit'
          git push origin HEAD:audit/live-cache-headers-20261113
