name: One-time PR48 automatic organization behavior audit
on:
  push:
    branches: [audit/pr48-autoplay-20261118]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Install browser automation
        run: npm install -g puppeteer-core@24
      - name: Check timed transition, no early autoplay, manual override and reduced-motion
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 100s env NODE_PATH="$(npm root -g)" node <<'JS'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const url = 'https://preview-bookkeeping-visual-s.dietz-bookkeeping-website.pages.dev/';
          (async () => {
            const browser = await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page = await browser.newPage();
              await page.setViewport({width:390,height:845,isMobile:true,hasTouch:true,deviceScaleFactor:1});
              const errs = [];
              page.on('pageerror', e => errs.push(e.message));
              const status = (await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000})).status();
              if (status!==200) throw Error('Preview HTTP status '+status);
              await page.waitForSelector('#bookkeeping-demo-board', {timeout:13000});
              await sleep(4550);
              let isOrganized = await page.evaluate(() => document.getElementById('bookkeeping-demo-board').textContent.includes('A clearer monthly picture'));
              console.log('NO_OFFSCREEN_AUTOPLAY', !isOrganized);
              if (isOrganized) throw Error('Autoplay ran before section was in view');
              await page.$eval('#bookkeeping-demo-title', el => el.scrollIntoView({block:'center'}));
              await sleep(4550);
              isOrganized = await page.evaluate(() => document.getElementById('bookkeeping-demo-board').textContent.includes('A clearer monthly picture'));
              console.log('AUTOPLAY_AFTER_4_SEC_IN_VIEW',isOrganized);
              if (!isOrganized) throw Error('Automatic organization did not activate');
              const counts = await page.evaluate(() => [
                document.querySelectorAll('.db-example-group--income li').length,
                document.querySelectorAll('.db-example-group--costs li').length,
                document.querySelectorAll('.db-example-group--expenses li').length,
              ]);
              console.log('ENTRY_COUNTS',JSON.stringify(counts));
              if(counts.join(',')!=='8,3,7') throw Error('Illustrative records changed');
              await page.click('button[aria-pressed="false"][aria-controls="bookkeeping-demo-board"]');
              await sleep(4600);
              const manual = await page.evaluate(() => ({
                unsorted:document.querySelectorAll('.db-example-slip').length===12,
                sorted:document.getElementById('bookkeeping-demo-board').textContent.includes('A clearer monthly picture')
              }));
              console.log('MANUAL_OVERRIDE',JSON.stringify(manual));
              if(!manual.unsorted||manual.sorted)throw Error('Timer ignored manual override');
              const reducedPage=await browser.newPage();
              await reducedPage.setViewport({width:390,height:845,isMobile:true,hasTouch:true});
              await reducedPage.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
              await reducedPage.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              await reducedPage.waitForSelector('#bookkeeping-demo-title',{timeout:13000});
              await reducedPage.$eval('#bookkeeping-demo-title',el=>el.scrollIntoView({block:'center'}));
              await sleep(4650);
              const reduced=await reducedPage.evaluate(()=>({
                slips:document.querySelectorAll('.db-example-slip').length,
                sorted:document.getElementById('bookkeeping-demo-board').textContent.includes('A clearer monthly picture'),
                animation:getComputedStyle(document.querySelector('.db-example-slip')).animationName
              }));
              console.log('REDUCED_MOTION',JSON.stringify(reduced));
              if(reduced.slips!==12||reduced.sorted||reduced.animation!=='none')throw Error('Reduced motion autoplay was not suppressed');
              await reducedPage.click('button[aria-pressed="false"][aria-controls="bookkeeping-demo-board"]');
              const manuallySorted=await reducedPage.evaluate(()=>document.getElementById('bookkeeping-demo-board').textContent.includes('A clearer monthly picture'));
              console.log('REDUCED_MOTION_MANUAL_STILL_WORKS',manuallySorted);
              if(!manuallySorted||errs.length)throw Error('Manual control or JS errors');
              console.log('PR48_AUTOPLAY_AUDIT_PASS');
            } finally {await browser.close();}
          })().catch(e=>{console.error('AUDIT_FAILED',e.stack||e);process.exitCode=1});
          JS
