name: One-time WWW redirect and canonical audit
on:
  push:
    branches: [audit/seo-www-canonical-check-20261115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read-only live URL, redirect and canonical check
        shell: bash
        run: |
          set -uo pipefail
          for path in "/" "/monthly-bookkeeping/?source=www-check&term=bookkeeping" "/tampa-cleanup-bookkeeping/?utm_source=redirect_test"; do
            echo "TEST_PATH $path"
            for host in "www.dietzbookkeeping.com" "dietzbookkeeping.com"; do
              url="https://$host$path"
              echo "REQUEST $url"
              curl --max-time 25 --connect-timeout 10 -sS -o /dev/null -D /tmp/direct-headers.txt -w "DIRECT code=%{http_code} location=%{redirect_url}\n" "$url" || echo 'DIRECT_REQUEST_FAILED'
              grep -iE '^(HTTP/|location:|x-robots-tag:|content-type:|cache-control:)' /tmp/direct-headers.txt | head -12 || true
              curl -sSL --max-time 35 --connect-timeout 10 -o /tmp/final.html -w "FINAL code=%{http_code} url=%{url_effective} redirects=%{num_redirects}\n" "$url" || echo 'FOLLOW_REQUEST_FAILED'
              if [ "$host" = "dietzbookkeeping.com" ]; then
                grep -ioE '<link rel="canonical"[^>]+>' /tmp/final.html | head -2 || true
                grep -ioE '<meta name="robots"[^>]+>' /tmp/final.html | head -2 || true
              fi
            done
          done
          echo "ROBOTS_TXT"
          curl -sSL --max-time 25 https://dietzbookkeeping.com/robots.txt | grep -E '^(User-agent: \*|Allow: /|Sitemap:)' | tail -6
          echo "SITEMAP_STATUS"
          curl -sS -o /tmp/sitemap.xml --max-time 25 -w 'http=%{http_code} size=%{size_download} bytes\n' https://dietzbookkeeping.com/sitemap.xml
          echo "CANONICAL_AUDIT_FINISHED"
