name: One-time PR46 accessibility and functionality preview check

on:
  push:
    branches: [audit/pr46-a11y-preview-20261114]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Lighthouse and Puppeteer
        run: npm install -g lighthouse@13 puppeteer-core@24
      - name: Confirm PR46 version reached Cloudflare branch preview
        shell: bash
        run: |
          python3 - <<'PY'
          import time,urllib.request
          base='https://preview-a11y-cleanup-2026111.dietz-bookkeeping-website.pages.dev'
          for i in range(30):
              with urllib.request.urlopen(urllib.request.Request(base+'/',headers={'User-Agent':'Mozilla/5.0 AccessibilityPreviewAudit'}),timeout=25) as r:
                  h=r.read().decode('utf-8','replace')
              with urllib.request.urlopen(urllib.request.Request(base+'/schedule/',headers={'User-Agent':'Mozilla/5.0 AccessibilityPreviewAudit'}),timeout=25) as r:
                  schedule=r.read().decode('utf-8','replace')
              complete=('role="img"' in h and 'bg-blue-700' in h and '<h2 class="font-semibold text-slate-900 mb-4">Services</h2>' in schedule)
              print('PREVIEW_REVISION_CHECK',i+1,'is_updated',complete,'roles',h.count('role="img"'))
              if complete:break
              time.sleep(6)
          assert complete,'Final PR46 build not visible at preview URL'
          print('PR46_PREVIEW_VERSION_OK')
          PY
      - name: Lighthouse check desktop homepage and mobile schedule
        shell: bash
        run: |
          set -eu
          base='https://preview-a11y-cleanup-2026111.dietz-bookkeeping-website.pages.dev'
          lighthouse "$base/" --preset=desktop --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=accessibility --throttling-method=simulate --output=json --output-path=/tmp/home.json --quiet
          lighthouse "$base/schedule/" --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=accessibility --throttling-method=simulate --output=json --output-path=/tmp/schedule.json --quiet
          python3 - <<'PY'
          import json
          for name,path in [('desktop-home','/tmp/home.json'),('mobile-schedule','/tmp/schedule.json')]:
              d=json.load(open(path));cats=d['categories'];a=d['audits']
              print('REPORT',name,'version',d['lighthouseVersion'],'a11y',round(cats['accessibility']['score']*100))
              issues=[r['id'] for r in cats['accessibility']['auditRefs'] if a[r['id']].get('score') is not None and a[r['id']]['score']<1]
              print('FAILURES',name,issues)
              for key in ('aria-prohibited-attr','color-contrast','heading-order'):
                  x=a.get(key,{})
                  print('FOCUSED_CHECK',name,key,x.get('score'))
                  assert x.get('score') in (1,None),'A11Y regression '+name+' '+key
          print('PR46 ACCESSIBILITY AUDITS PASS')
          PY
      - name: Browser smoke test Keily and Calendly unchanged
        shell: bash
        run: |
          NODE_PATH="$(npm root -g)" node <<'JS'
          const p=require('puppeteer-core');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await p.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const base='https://preview-a11y-cleanup-2026111.dietz-bookkeeping-website.pages.dev';
            const home=await b.newPage();
            await home.setViewport({width:1440,height:900,deviceScaleFactor:1});
            let jot=0;
            home.on('request',req=>{if(/jotform\.com|jotfor\.ms/.test(req.url()))jot++;});
            await home.goto(base+'/',{waitUntil:'load',timeout:30000});
            await wait(900);
            const state=await home.evaluate(()=>{
              const nav=document.querySelector('a.ios-btn[href="/schedule"]');
              const rate=[...document.querySelectorAll('[role="img"][aria-label="Rated 5 out of 5 stars on Google"]')];
              return {navClasses:nav?.className,starRatings:rate.length,keily:!!document.querySelector('button[aria-label="Chat with Keily"]')};
            });
            console.log('HOME_DOM',JSON.stringify(state),'jotformBeforeClick',jot);
            if(!state.navClasses?.includes('bg-blue-700')||state.starRatings!==3||!state.keily||jot!==0)throw Error('Home semantics or Keily regression');
            const schedule=await b.newPage();
            await schedule.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:1});
            await schedule.goto(base+'/schedule/',{waitUntil:'load',timeout:30000});
            await wait(10000);
            const hasFrame=await schedule.evaluate(()=>({calendar:!!document.querySelector('iframe[src*="calendly.com"]'),footerH2:[...document.querySelectorAll('footer h2')].map(x=>x.textContent),fallback:document.body.innerText.includes('Open Calendly in a new tab')}));
            console.log('SCHEDULE_DOM',JSON.stringify(hasFrame));
            if(!hasFrame.calendar||!hasFrame.fallback||hasFrame.footerH2.length<3)throw Error('Schedule functionality or headings regression');
            await b.close();
            console.log('PR46 BROWSER SMOKE PASS');
          })().catch(e=>{console.error('TEST_FAILED',e.stack||e);process.exit(1)});
          JS
