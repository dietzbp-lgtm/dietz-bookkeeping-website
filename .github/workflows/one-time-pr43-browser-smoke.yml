name: One-time PR43 browser preview smoke test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect rendered consultation page after client hydration
        shell: bash
        run: |
          set -eu
          google-chrome --version
          url="https://preview-mobile-calendly-spli.dietz-bookkeeping-website.pages.dev/schedule/"
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --virtual-time-budget=12000 --dump-dom "$url" >/tmp/schedule-dom.html 2>/tmp/chrome-stderr.txt || { tail -60 /tmp/chrome-stderr.txt; exit 1; }
          python3 - <<'PY'
          from html.parser import HTMLParser
          html=open('/tmp/schedule-dom.html').read()
          print('DOM characters:',len(html))
          print('Page title:', 'Schedule a free bookkeeping consultation' in html)
          print('Calendly iframe:', 'https://calendly.com/' in html and '<iframe' in html)
          print('Fallback:', 'Loading available consultation times' in html)
          print('Direct booking fallback:', 'Open Calendly in a new tab' in html)
          assert 'Schedule a free bookkeeping consultation' in html
          assert 'Open Calendly in a new tab' in html
          assert 'calendly.com' in html and '<iframe' in html, 'Calendar iframe missing after hydration'
          print('PR43 BROWSER SCHEDULE SMOKE PASS')
          PY
