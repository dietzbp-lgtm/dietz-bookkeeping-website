name: PR21 one-time local industry photos
on:
  push:
    branches:
      - feature/pr21-industry-images-real-estate
    paths:
      - .github/workflows/pr21-local-photos.yml

permissions:
  contents: write

jobs:
  commit-optimized-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr21-industry-images-real-estate
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Download licensed photos and convert to local optimized WebP
        shell: bash
        run: |
          python - <<'PY'
          import io, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          output=Path('public/images')
          output.mkdir(parents=True,exist_ok=True)
          images=[
            ('industry-cleaning-photo.webp',9462746,(960,1200)),
            ('industry-contractors-photo.webp',11427401,(960,1200)),
            ('industry-real-estate-photo.webp',12911744,(960,1200)),
            ('industry-cleaning-detail.webp',3177257,(880,630)),
            ('industry-contractors-detail.webp',4792479,(880,630)),
            ('industry-real-estate-detail.webp',8482520,(880,630))
          ]
          for name,photo_id,dims in images:
            url=f'https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1600'
            request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(request,timeout=55) as response:
              data=response.read()
            if len(data)<2000 or len(data)>12_000_000:
              raise RuntimeError(f'Unexpected photo size for {name}: {len(data)} bytes')
            photo=Image.open(io.BytesIO(data))
            photo=ImageOps.exif_transpose(photo).convert('RGB')
            photo=ImageOps.fit(photo,dims,method=Image.Resampling.LANCZOS,centering=(0.5,0.42))
            file=output/name
            photo.save(file,format='WEBP',quality=72,method=6)
            print(f'{file}: {file.stat().st_size} bytes')
          PY
      - name: Record Pexels sources and license
        shell: bash
        run: |
          cat > public/images/INDUSTRY_PHOTO_SOURCES.md <<'EOF'
          # Industry-page image credits
          These are illustrative stock photographs, not Dietz Bookkeeping clients, partners, or staff.
          Used under the [Pexels license](https://www.pexels.com/legal-pages/license/):
          free commercial website use and modifications are permitted; no endorsement implied.
          
          - Cleaning hero: https://www.pexels.com/photo/a-woman-cleaning-a-kitchen-9462746/ — Liliana Drew
          - Contractors hero: https://www.pexels.com/photo/man-cutting-plywood-on-floor-11427401/ — Jimmy Nilsson Masth
          - Real-estate hero: https://www.pexels.com/photo/woman-with-documents-and-laptop-12911744/ — Mizuno K
          - Cleaning detail: https://www.pexels.com/photo/cleaning-supplies-in-a-bucket-3177257/ — Ellie Burgin
          - Contractors detail: https://www.pexels.com/photo/instruments-prepared-for-measurements-in-house-4792479/ — Anete Lusina
          - Real-estate detail: https://www.pexels.com/photo/a-house-for-sale-8482520/ — Thirdman
          EOF
      - name: Commit image assets to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/industry-*-photo.webp public/images/industry-*-detail.webp public/images/INDUSTRY_PHOTO_SOURCES.md
          git diff --cached --quiet && exit 0
          git commit -m "PR21: save six licensed, optimized industry photos locally"
          git push origin HEAD:feature/pr21-industry-images-real-estate
