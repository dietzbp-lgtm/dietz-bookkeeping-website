name: One-time compact Keily visual interaction audit
on:
  push:
    branches: [audit/keily-compact-mobile-20261114]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Install headless browser
        run: npm install -g puppeteer-core@24
      - name: Verify live preview chat layout and zero pre-click agent load
        shell: bash
        run: |
          NODE_PATH="$(npm root -g)" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            for(const size of [{label:'phone',width:390,height:844},{label:'fold',width:752,height:880},{label:'desktop',width:1280,height:900}]){
              const page=await browser.newPage();
              await page.setViewport({width:size.width,height:size.height,isMobile:size.label==='phone',deviceScaleFactor:1,hasTouch:size.label==='phone'});
              let jot=0;
              page.on('request',req=>{if(/jotform\.com|jotfor\.ms/.test(req.url()))jot++});
              await page.goto('https://preview-keily-one-tap-launch.dietz-bookkeeping-website.pages.dev/',{waitUntil:'load',timeout:35000});
              await sleep(1500);
              const before=await page.evaluate(()=>{
                const b=document.querySelector('button[aria-label="Chat with Keily"]');
                const rc=b?.getBoundingClientRect();
                return {button:!!b,label:b?.textContent,rect:rc&&{width:rc.width,height:rc.height},iframeCount:document.querySelectorAll('iframe').length};
              });
              console.log('BEFORE',size.label,JSON.stringify(before),'jotformRequests',jot);
              if(!before.button||before.rect.width>160||before.iframeCount!==0||jot!==0)throw Error('Initial compact launcher regression: '+size.label);
              await page.click('button[aria-label="Chat with Keily"]');
              await sleep(7500);
              const agent=page.frames().find(f=>/www\.jotform\.com\/agent\//.test(f.url()));
              let content=agent ? await agent.evaluate(()=>({title:document.title,hasGreeting:document.body.innerText.includes('Hi! I’m Keily'),textarea:document.querySelectorAll('textarea').length})) : null;
              const after=await page.evaluate(()=>{
                const panel=document.querySelector('section[role="dialog"][aria-label="Chat with Keily"]');
                const link=panel?.querySelector('a[aria-label="Open Keily chat in a new tab"]');
                const r=panel?.getBoundingClientRect();
                return {opened:panel?.getAttribute('aria-hidden')==='false',rect:r&&{width:r.width,height:r.height},hasExternal:!!link,hasClose:!!panel?.querySelector('button[aria-label="Close Keily chat"]'),launcherHidden:!document.querySelector('button[aria-label="Chat with Keily"]')};
              });
              console.log('AFTER',size.label,JSON.stringify(after),'agent',JSON.stringify(content),'jotformRequests',jot);
              if(!agent||!content?.hasGreeting||!content?.textarea||!after.opened||!after.launcherHidden||!after.hasClose||!after.hasExternal)throw Error('One-tap chat regression: '+size.label);
              await page.click('button[aria-label="Close Keily chat"]');
              const rebutton=await page.$('button[aria-label="Chat with Keily"]');
              if(!rebutton)throw Error('Launcher missing after close');
              await rebutton.click();
              const isFrameStill=await page.evaluate(()=>!!document.querySelector('iframe[title="Keily AI bookkeeping assistant chat"]'));
              if(!isFrameStill)throw Error('Iframe not retained after reopen');
              console.log('PASS',size.label);
              await page.close();
            }
            await browser.close();
            console.log('COMPACT KEILY SMOKE PASS');
          })().catch(e=>{console.error('TEST_FAIL',e);process.exitCode=1});
          JS
