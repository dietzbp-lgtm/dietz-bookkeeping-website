name: One-time final PR48 accessibility comparison
on:
  push:
    branches: [audit/pr48-final-accessibility-20261118]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install Lighthouse
        run: npm install -g lighthouse@13
      - name: Check final Cloudflare preview has new content and unchanged SEO
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time
          url='https://preview-bookkeeping-visual-s.dietz-bookkeeping-website.pages.dev/'
          for i in range(20):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as response:
              source=response.read().decode('utf-8','replace')
            if 'From daily transactions to clearer decisions.' in source:
              print('PR48_FINAL_CONTENT_PUBLISHED')
              break
            print('WAITING_FOR_PREVIEW',i+1)
            time.sleep(5)
          else:raise AssertionError('Final PR48 content not visible on preview')
          assert '<title>Small Business Bookkeeping Nationwide | Dietz Bookkeeping</title>' in source
          assert 'https://dietzbookkeeping.com/' in source
          PY
      - name: Lighthouse mobile accessibility and SEO audit
        shell: bash
        run: |
          timeout 90s lighthouse https://preview-bookkeeping-visual-s.dietz-bookkeeping-website.pages.dev/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,seo,best-practices --output=json --output-path=/tmp/report.json --quiet
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/report.json'))
          scores={k:round(x['score']*100) for k,x in r['categories'].items()}
          failures={key:[x['id'] for x in r['categories'][key]['auditRefs'] if r['audits'][x['id']].get('score') is not None and r['audits'][x['id']]['score']<1] for key in ['seo','accessibility']}
          print('FINAL_LIGHTHOUSE_SCORES',scores)
          print('FINAL_LIGHTHOUSE_FAILURES',failures)
          assert scores['accessibility']==100,'Contrast or accessibility regression'
          assert scores['best-practices']>=95,'Best practice regression'
          assert scores['performance']>=75,'Major performance regression'
          assert set(failures['seo'])<={'is-crawlable'},'Unexpected SEO issue'
          print('PR48_FINAL_AUDIT_PASS')
          PY
