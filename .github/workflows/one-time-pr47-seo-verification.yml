name: One-time PR47 SEO and lead-path preview verification

on:
  push:
    branches: [audit/pr47-seo-preview-verification-20261115]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Install browser and Lighthouse
        run: |
          npm install -g puppeteer-core@24 lighthouse@13
          lighthouse --version
      - name: Verify final Cloudflare branch preview HTML and key routes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,re,html
          root='https://preview-seo-tampa-quickbooks.dietz-bookkeeping-website.pages.dev'
          urls={
             '/monthly-bookkeeping/': ('Monthly Bookkeeping Services | Tampa & Nationwide | Dietz Bookkeeping','See how QuickBooks bookkeeping support works'),
             '/tampa-bank-reconciliation/': ('Bank Reconciliation Services in Tampa, FL | Dietz Bookkeeping','Explore QuickBooks Online bookkeeping support'),
             '/tampa-cleanup-bookkeeping/': ('Tampa Bookkeeping Cleanup & Catch-Up | Dietz Bookkeeping','See monthly bookkeeping support'),
             '/quickbooks-online-bookkeeping/': ('QuickBooks Online Bookkeeping Services | Dietz Bookkeeping','QuickBooks questions for cleaning and contracting businesses'),
             '/quickbooks-bank-reconciliation-guide/': ('How to Reconcile in QuickBooks Online | Dietz Bookkeeping','QuickBooks Online bookkeeping service'),
          }
          for attempt in range(30):
            page=urllib.request.urlopen(urllib.request.Request(root+'/quickbooks-online-bookkeeping/',headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
            if 'QuickBooks questions for cleaning and contracting businesses' in page:break
            print('WAIT_FINAL_PREVIEW',attempt+1)
            time.sleep(6)
          else:raise AssertionError('Final PR47 preview did not deploy')
          for path,(title,phrase) in urls.items():
            url=root+path
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as response:
              content=response.read().decode('utf-8','replace')
              status=response.status
            match=re.search(r'<link rel="canonical"[^>]*>',content,re.I)
            description=re.search(r'<meta name="description"[^>]*>',content,re.I)
            assert status==200 and html.escape(title) in content,'Title or HTTP mismatch '+path
            assert phrase in content,'New text not prerendered '+path
            assert match and 'https://dietzbookkeeping.com'+path in match.group(0),'Canonical mismatch '+path
            assert description,'Missing metadata '+path
            assert 'noindex' not in content.lower(),'Unexpected noindex '+path
            print('PAGE_PASS',path,'http',status,'canonical',match.group(0),'metadata',description.group(0))
          print('PR47 PRERENDERED SEO PAGES PASS')
          PY
      - name: Lighthouse test QuickBooks and Tampa reconciliation
        shell: bash
        run: |
          set -euo pipefail
          url='https://preview-seo-tampa-quickbooks.dietz-bookkeeping-website.pages.dev'
          lighthouse "$url/quickbooks-online-bookkeeping/" --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,seo,best-practices --throttling-method=simulate --output=json --output-path=/tmp/quickbooks.json --quiet
          lighthouse "$url/tampa-bank-reconciliation/" --preset=desktop --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=accessibility,seo,best-practices --throttling-method=simulate --output=json --output-path=/tmp/tampa.json --quiet
          python3 - <<'PY'
          import json
          for name,path in [('quickbooks_mobile','/tmp/quickbooks.json'),('tampa_desktop','/tmp/tampa.json')]:
            d=json.load(open(path))
            scores={key:round(cat['score']*100) for key,cat in d['categories'].items() if cat.get('score') is not None}
            failures={key:[r['id'] for r in d['categories'][key]['auditRefs'] if d['audits'][r['id']].get('score') is not None and d['audits'][r['id']]['score']<1] for key in ('accessibility','seo')}
            print('LIGHTHOUSE',name,'scores',json.dumps(scores),'failed',json.dumps(failures))
            assert scores['seo']>=90 and scores['accessibility']>=95,'SEO/a11y unexpectedly low'
            assert 'performance' not in scores or scores['performance']>=70,'Unexpected severe performance regression'
          print('PR47 LIGHTHOUSE AUDIT PASS')
          PY
      - name: Check links, chat and consultation/estimate routes in a browser
        shell: bash
        run: |
          NODE_PATH="$(npm root -g)" node <<'JS'
          const p=require('puppeteer-core');
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            const b=await p.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const root='https://preview-seo-tampa-quickbooks.dietz-bookkeeping-website.pages.dev';
            const page=await b.newPage();
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:1});
            let jot=0;
            page.on('request',req=>{if(/jotform.com|jotfor.ms/i.test(req.url()))jot++});
            const resp=await page.goto(root+'/quickbooks-online-bookkeeping/',{waitUntil:'load',timeout:30000});
            await pause(900);
            const q=await page.evaluate(()=>({
              industryLinks:[...document.querySelectorAll('a[href]')].filter(x=>x.href.includes('bookkeeping-for-')).map(x=>new URL(x.href).pathname),
              keily:!!document.querySelector('button[aria-label="Chat with Keily"]'),
              title:document.title
            }));
            console.log('QUICKBOOKS_BROWSER',resp.status(),JSON.stringify(q),'jotformBeforeClick',jot);
            if(resp.status()!==200||!q.keily||jot!==0||!q.industryLinks.includes('/bookkeeping-for-cleaning-businesses/')||!q.industryLinks.includes('/bookkeeping-for-contractors/'))throw Error('QuickBooks browser regression');
            const links=['/monthly-bookkeeping/','/tampa-bank-reconciliation/','/tampa-cleanup-bookkeeping/','/quickbooks-bank-reconciliation-guide/','/estimate/','/schedule/'];
            for(const path of links){
              const res=await page.goto(root+path,{waitUntil:'load',timeout:30000});
              const state=await page.evaluate(()=>({mainHeading:!!document.querySelector('h1'),title:document.title,estimateLink:!!document.querySelector('a[href="/estimate/"],a[href="/estimate"]'),scheduleLink:!!document.querySelector('a[href="/schedule/"],a[href="/schedule"]')}));
              console.log('ROUTE_BROWSER',path,res.status(),JSON.stringify(state));
              if(res.status()!==200||!state.mainHeading)throw Error('Route missing '+path);
            }
            await page.goto(root+'/schedule/',{waitUntil:'load',timeout:30000});
            await pause(9500);
            const cal=await page.evaluate(()=>!!document.querySelector('iframe[src*="calendly.com"]'));
            console.log('CALENDLY_IFRAME',cal);
            if(!cal)throw Error('Calendar regression');
            await b.close();
            console.log('PR47 LIVE PREVIEW BROWSER CHECK PASS');
          })().catch(e=>{console.error('BROWSER_FAILURE',e.stack||String(e));process.exitCode=1});
          JS
