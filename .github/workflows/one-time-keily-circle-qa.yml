name: One-time Keily 48px mobile launcher smoke

on:
  push:
    branches: [audit/keily-mobile-circle-20261114]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Puppeteer
        run: npm install -g puppeteer-core@24
      - name: Verify circle on phones, pill on larger devices, and one-tap chat
        shell: bash
        run: |
          NODE_PATH="$(npm root -g)" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const url='https://e90f5a58.dietz-bookkeeping-website.pages.dev/';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            for(const size of [{name:'small-phone',w:320,h:680,mobile:true},{name:'phone',w:390,h:844,mobile:true},{name:'fold-wide',w:752,h:880,mobile:false}]){
              const page=await browser.newPage();
              await page.setViewport({width:size.w,height:size.h,isMobile:size.mobile,hasTouch:size.mobile,deviceScaleFactor:1});
              let jot=0;
              page.on('request',req=>{if(/jotform.com|jotfor.ms/.test(req.url())) jot++});
              await page.goto(url,{waitUntil:'load',timeout:30000});
              await sleep(1200);
              const before=await page.evaluate(()=>{
                const button=document.querySelector('button[aria-label="Chat with Keily"]');
                const rect=button?.getBoundingClientRect();
                const label=button?.querySelector('span.text-sm');
                return {exists:!!button,w:rect?.width,h:rect?.height,label:label?.textContent,visibleText:label&&getComputedStyle(label).display!=='none',iframeCount:document.querySelectorAll('iframe').length};
              });
              console.log('BEFORE',size.name,JSON.stringify(before),'JotformRequests',jot);
              if(!before.exists||jot!==0||before.iframeCount!==0)throw new Error('Keily agent preloaded or launcher missing: '+size.name);
              if(size.w<640 && (before.w<47||before.w>49||before.h<47||before.h>49||before.visibleText))throw new Error('Not a 48px mobile circle: '+size.name);
              if(size.w>=640 && (before.w<80||!before.visibleText||!before.label?.includes('Keily')))throw new Error('Labelled pill missing on wide device');
              await page.click('button[aria-label="Chat with Keily"]');
              await sleep(7500);
              const frame=page.frames().find(f=>/^https:\/\/www\.jotform\.com\/agent\//.test(f.url()));
              const agent=frame?await frame.evaluate(()=>({title:document.title,greeting:document.body?.innerText.includes('Hi! I’m Keily'),input:document.querySelectorAll('textarea').length})):null;
              const state=await page.evaluate(()=>({dialogOpen:document.querySelector('section[role="dialog"]')?.getAttribute('aria-hidden')==='false',launcherGone:!document.querySelector('button[aria-label="Chat with Keily"]')}));
              console.log('OPEN',size.name,'JotformRequests',jot,'AGENT',JSON.stringify(agent),'STATE',JSON.stringify(state));
              if(!agent?.greeting||!agent.input||!state.dialogOpen||!state.launcherGone)throw new Error('One-tap chat broken: '+size.name);
              await page.click('button[aria-label="Close Keily chat"]');
              const reappeared=await page.$('button[aria-label="Chat with Keily"]');
              if(!reappeared)throw new Error('Launcher did not return after closing: '+size.name);
              await page.close();
              console.log('PASS',size.name);
            }
            await browser.close();
            console.log('KEILY MOBILE CIRCLE AND WIDE PILL PASS');
          })().catch(e=>{console.error('TEST_FAIL',e.stack||String(e));process.exitCode=1});
          JS
