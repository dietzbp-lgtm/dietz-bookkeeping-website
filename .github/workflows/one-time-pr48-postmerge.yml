name: One-time PR48 production SEO and animation smoke
on:
  push:
    branches: [audit/pr48-postmerge-live-20261118]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Verify live server-rendered text, canonical, and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,re,html
          root='https://dietzbookkeeping.com'
          def fetch(path):
            req=urllib.request.Request(root+path,headers={'User-Agent':'Mozilla/5.0 (compatible; SiteVerification/1.0)'})
            with urllib.request.urlopen(req,timeout=25) as response:
              return response.status,dict(response.headers),response.read().decode('utf-8','replace')
          for i in range(28):
            status,headers,body=fetch('/')
            if 'From daily transactions to clearer decisions.' in body and 'This example uses fictional financial data' in body:
              print('UPDATED_CONTENT_LIVE',i,'status',status)
              break
            print('AWAIT_PRODUCTION',i+1)
            time.sleep(6)
          else:raise AssertionError('PR48 content not found on production in this run')
          checks=['Bookkeeping, illustrated','Reliable bookkeeping','Clean financials','Better decisions','From daily transactions to clearer decisions.','This example uses fictional financial data','helps you better understand your business finances. Learn more in our']
          for phrase in checks:
            assert phrase in body, 'Missing production content: '+phrase
          title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
          canonical=re.search(r'<link rel="canonical" href="([^"]+)"',body,re.I)
          description=re.search(r'<meta name="description" content="([^"]+)"',body,re.I)
          assert title and html.unescape(title.group(1))=='Small Business Bookkeeping Nationwide | Dietz Bookkeeping'
          assert canonical and canonical.group(1)=='https://dietzbookkeeping.com/'
          assert description and 'Monthly bookkeeping and cleanup' in description.group(1)
          assert 'noindex' not in str(headers).lower(),'Production robots-header regression'
          assert '<meta name="robots" content="noindex' not in body.lower(),'Production meta noindex'
          sitemap_status,_,sitemap=fetch('/sitemap.xml')
          assert sitemap_status==200 and sitemap.count('<loc>')==27,'Sitemap regression'
          print('PR48_LIVE_SEO_PASS',title.group(1),'canonical',canonical.group(1),'sitemap_count',sitemap.count('<loc>'))
          PY
      - name: Install headless browser
        run: npm install -g puppeteer-core@24
      - name: Verify live four-stage loop and manual control
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 105s env NODE_PATH="$(npm root -g)" node <<'JS'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(resolve => setTimeout(resolve,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page=await browser.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
              const res=await page.goto('https://dietzbookkeeping.com/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('#bookkeeping-demo-board',{timeout:16000});
              const stage=()=>page.evaluate(()=>[...document.querySelectorAll('button[aria-controls="bookkeeping-demo-board"]')].findIndex(b=>b.getAttribute('aria-pressed')==='true'));
              const text=()=>page.evaluate(()=>document.querySelector('#bookkeeping-demo-board')?.textContent||'');
              await page.$eval('#bookkeeping-demo-board',el=>el.scrollIntoView({block:'center'}));
              let steps=[await stage()];
              for(let i=1;i<=3;i++){
                await sleep(5400);
                steps.push(await stage());
              }
              console.log('LIVE_AUTOMATIC_SEQUENCE',JSON.stringify(steps));
              if(steps.join(',')!=='0,1,2,3')throw Error('Unexpected automatic loop sequence');
              if(!(await text()).includes('Three questions worth exploring'))throw Error('Stage four questions missing');
              const buttons=await page.$$('button[aria-controls="bookkeeping-demo-board"]');
              await buttons[2].click();
              await sleep(10400);
              const selected=await stage();
              console.log('LIVE_MANUAL_SELECTION_AFTER_10_SEC',selected);
              if(selected!==2)throw Error('Manual takeover failed to stop automatic loop');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('LIVE_MOBILE_OVERFLOW',overflow,'JS_ERRORS',JSON.stringify(errors));
              if(overflow>1||errors.length)throw Error('Mobile overflow or JavaScript errors');
              console.log('PR48_LIVE_ANIMATION_PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error('LIVE_ANIMATION_ERROR',e.stack||e);process.exitCode=1;});
          JS
