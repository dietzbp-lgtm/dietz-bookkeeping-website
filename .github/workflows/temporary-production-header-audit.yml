name: Temporary production header audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production caching and security response headers
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.error, ssl
          domain = 'https://dietzbookkeeping.com'
          fields = ['cache-control', 'content-type', 'strict-transport-security',
                    'content-security-policy', 'content-security-policy-report-only',
                    'x-frame-options', 'x-content-type-options', 'referrer-policy',
                    'permissions-policy', 'cross-origin-opener-policy',
                    'cross-origin-resource-policy', 'x-robots-tag', 'location']
          def check(url, method='GET'):
              print('\\n===',method,url,'===')
              req=urllib.request.Request(url, headers={'User-Agent':'DietzBookkeeping-HeaderAudit/1.0'},method=method)
              try:
                  resp=urllib.request.urlopen(req,timeout=25)
              except urllib.error.HTTPError as e:
                  resp=e
              except Exception as e:
                  print('FETCH ERROR:',type(e).__name__,str(e)[:200]);return ''
              with resp:
                  print('STATUS',resp.status,'FINAL',resp.geturl())
                  for f in fields:
                      if resp.headers.get(f) is not None:
                          print(f+':',resp.headers.get(f))
                  for key in ['strict-transport-security','content-security-policy','x-frame-options','x-content-type-options','permissions-policy']:
                      if resp.headers.get(key) is None:
                          print('ABSENT',key)
                  typ=resp.headers.get('content-type','')
                  body=resp.read(1500000).decode('utf-8','replace') if 'html' in typ else ''
              return body
          html=check(domain+'/')
          check(domain+'/services/')
          check(domain+'/sitemap.xml')
          check(domain+'/robots.txt')
          print('HTML length',len(html), 'has assets', '/assets/' in html)
          assets=list(dict.fromkeys(re.findall(r'/assets/[A-Za-z0-9._-]+[.](?:js|css)',html)))
          print('ASSETS FOUND',len(assets),assets[:6])
          for a in assets[:4]:
              check(domain+a)
          print('\\nAUDIT COMPLETED')
          PY

      - name: Assert new security headers on Cloudflare branch preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://audit-security-headers-20261113.dietz-bookkeeping-website.pages.dev/'
          ready=0
          for i in $(seq 1 14); do
            echo "Preview verification attempt $i"
            if curl --silent --show-error --fail --location --connect-timeout 10 --max-time 25 --dump-header /tmp/headers.txt --output /tmp/home.html "$url"; then
              cat /tmp/headers.txt | grep -i -E '^(HTTP/|cache-control:|strict-transport-security:|content-security-policy:|x-frame-options:|permissions-policy:)'
              if grep -iq '^strict-transport-security: max-age=15552000' /tmp/headers.txt &&
                 grep -iq '^x-frame-options: SAMEORIGIN' /tmp/headers.txt &&
                 grep -iq "^content-security-policy: frame-ancestors 'self'; base-uri 'self'; object-src 'none'" /tmp/headers.txt &&
                 grep -iq '^permissions-policy: geolocation=(), usb=()' /tmp/headers.txt &&
                 grep -iq '^cache-control: public, max-age=0, must-revalidate' /tmp/headers.txt; then
                ready=1
                break
              fi
            fi
            sleep 9
          done
          test "$ready" = 1
          python3 - <<'PY'
          import re
          html=open('/tmp/home.html').read()
          files=list(dict.fromkeys(re.findall(r'/assets/[A-Za-z0-9._-]+[.](?:js|css)',html)))
          print('Preview asset files:',files)
          assert any(x.endswith('.js') for x in files) and any(x.endswith('.css') for x in files)
          open('/tmp/assets-list.txt','w').write('\\n'.join(files))
          PY
          while read -r path; do
            echo "VERIFY ASSET $path"
            curl --silent --show-error --fail --location --max-time 25 --dump-header /tmp/asset-headers.txt --output /dev/null "https://audit-security-headers-20261113.dietz-bookkeeping-website.pages.dev$path"
            grep -iq '^cache-control: public, max-age=31536000, immutable' /tmp/asset-headers.txt
          done < /tmp/assets-list.txt
          echo 'PREVIEW SECURITY AND CACHE HEADERS PASS'
