name: Verify PR41 cache header behavior on branch preview (one-time)

on:
  push:
    branches:
      - audit/live-cache-headers-20261113
    paths:
      - .github/workflows/verify-pr41-preview.yml

permissions:
  contents: read

jobs:
  verify-preview-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch preview HTML and inspect cache headers
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://a693c112.dietz-bookkeeping-website.pages.dev'
          def get(path, method='HEAD'):
              req=urllib.request.Request(base+path,method=method,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  body=response.read() if method=='GET' else b''
                  return response.status,response.headers,body
          status,headers,raw=get('/',method='GET')
          assert status==200,status
          markup=raw.decode('utf8','replace')
          print('HTML:',headers.get('Cache-Control'))
          html_cache=headers.get('Cache-Control','')
          assert 'max-age=0' in html_cache, f'HTML must revalidate: {html_cache}'
          items=[
            ('JS',re.search(r'(?:src|href)="(/assets/[^"]+\.js)"',markup)),
            ('CSS',re.search(r'(?:src|href)="(/assets/[^"]+\.css)"',markup))
          ]
          for kind,match in items:
              assert match, f'{kind} not referenced in pre-rendered HTML'
              path=match.group(1)
              status,headers,_=get(path)
              value=headers.get('Cache-Control','')
              print(f'{kind} {path}: {value}')
              assert status==200, f'{kind} HTTP {status}'
              assert 'max-age=31536000' in value and 'immutable' in value, f'{kind} cache rule missing: {value}'
          status,headers,_=get('/images/dietzbookeepingabout.webp')
          image_cache=headers.get('Cache-Control','')
          print('Portrait:',image_cache)
          assert status==200
          assert 'immutable' not in image_cache, 'Unversioned image must not be marked immutable'
          status,headers,_=get('/sitemap.xml')
          sitemap_cache=headers.get('Cache-Control','')
          print('Sitemap:',sitemap_cache)
          assert status==200
          assert 'max-age=0' in sitemap_cache, 'Sitemap must revalidate'
          print('SUCCESS: hashed JS/CSS immutable 1y; HTML/sitemap fresh; image not immutable')
          PY
