name: Verify PR 40 live QuickBooks reviews (one-time)

on:
  push:
    branches:
      - audit/verify-pr40-live-20261112
    paths:
      - .github/workflows/verify-pr40-live.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the live custom domain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            -H "Cache-Control: no-cache" \
            "https://dietzbookkeeping.com/?verify_pr40=5834fe981fb2-20261112" \
            --output /tmp/pr40-live-homepage.html
          test "$(stat -c%s /tmp/pr40-live-homepage.html)" -gt 10000
          echo "Fetched live homepage: $(stat -c%s /tmp/pr40-live-homepage.html) bytes"

      - name: Validate server-rendered reviews, URLs and existing homepage
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from html import unescape
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.active = None
                  self.canonical = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'a':
                      self.active = {'href': a.get('href'), 'target': a.get('target'), 'rel': a.get('rel') or '', 'text': ''}
                  if tag == 'link' and a.get('rel') == 'canonical':
                      self.canonical = a.get('href')
              def handle_data(self, data):
                  if self.active is not None:
                      self.active['text'] += data
              def handle_endtag(self, tag):
                  if tag == 'a' and self.active is not None:
                      self.links.append(self.active)
                      self.active = None

          markup = Path('/tmp/pr40-live-homepage.html').read_text(encoding='utf-8', errors='replace')
          parsed = Page()
          parsed.feed(markup)
          decoded = unescape(markup)

          required = {
            'Poliane Navarro': 'https://maps.app.goo.gl/aX84HkjikELhTkkF7',
            'Idany Ruiz': 'https://maps.app.goo.gl/Mfk8b7qoBt7RuLQY7',
            'Joice Kelly': 'https://maps.app.goo.gl/NyzvNdjv48oabiEs8'
          }
          assert 'What clients say about QuickBooks support' in decoded, 'QuickBooks review section not present'
          for reviewer, url in required.items():
              hits = [a for a in parsed.links if reviewer in a['text'] and a['href'] == url]
              assert len(hits) == 1, f'{reviewer}: expected one matching linked name, got {len(hits)}'
              assert hits[0]['target'] == '_blank', f'{reviewer}: not new tab'
              assert 'noopener' in hits[0]['rel'] and 'noreferrer' in hits[0]['rel'], f'{reviewer}: missing external link protections'
              assert any(a['href'] == url and 'Read review on Google' in a['text'] for a in parsed.links), f'{reviewer}: missing review CTA'
              print(f'PASS: {reviewer} name and read-review CTA link to {url}')

          assert 'Client Feedback & Reviews' in decoded, 'Existing testimonial section missing'
          for name in ('Lissandra P.', 'Nelson Silva'):
              assert name in decoded, f'Existing testimonial missing: {name}'
          assert 'Monthly bookkeeping for' in decoded and 'growing service businesses.' in decoded, 'Approved hero changed'
          assert parsed.canonical == 'https://dietzbookkeeping.com/', f'Canonical unexpected: {parsed.canonical}'
          assert 'See reviews on Google Maps' in decoded, 'General business review link missing'
          print('PASS: original testimonials, hero, canonical and general review link preserved')
          print('SUCCESS: PR #40 review cards and links are served by the live custom domain')
          PY
