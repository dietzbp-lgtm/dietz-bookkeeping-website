name: One-time live test of GSC discovered not indexed URLs
on:
  push:
    branches: [audit/gsc-discovered-not-indexed-20261115]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check status, canonical, robots and sitemap for the three pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,xml.etree.ElementTree as ET
          root='https://dietzbookkeeping.com'
          slugs=['/quickbooks-online-bookkeeping/','/quickbooks-profit-and-loss-report/','/service-areas/']
          sitemap_url=root+'/sitemap.xml'
          with urllib.request.urlopen(urllib.request.Request(sitemap_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as rsp:
            xml=rsp.read()
            print('SITEMAP_STATUS',rsp.status,'BYTES',len(xml))
          urls={x.text for x in ET.fromstring(xml).iter() if x.tag.endswith('loc')}
          for slug in slugs:
            url=root+slug
            req=urllib.request.Request(url,headers={'User-Agent':'Googlebot','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=25) as res:
              html=res.read().decode('utf-8','replace')
              final_url=res.geturl()
              status=res.status
              x_robots=res.headers.get('X-Robots-Tag')
            canonical=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]*>',html,re.I)
            robots=re.findall(r'<meta[^>]+name=["\']robots["\'][^>]*>',html,re.I)
            title=re.search(r'<title>([^<]+)</title>',html,re.I)
            print('PAGE',url)
            print('STATUS',status,'FINAL_URL',final_url)
            print('TITLE',title.group(1) if title else 'MISSING')
            print('CANONICAL',canonical[:1])
            print('ROBOTS_META',robots[:1], 'ROBOTS_HEADER',x_robots)
            print('IN_SITEMAP',url in urls)
            print('HAS_H1',bool(re.search(r'<h1[ >]',html,re.I)))
            assert status==200 and final_url==url and canonical and url in canonical[0] and url in urls, 'URL not consistently canonical or not in sitemap'
          print('ALL_THREE_CRAWLABILITY_CHECKS_PASS')
          PY
